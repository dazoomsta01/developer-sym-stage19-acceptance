name: Developer Sym Stage 20/21 CI

on:
  push:
    branches:
      - 'dev/stage20-*'
      - 'dev/stage21-*'

permissions:
  contents: read

jobs:
  stage20-ci:
    name: stage20-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify Developer Sym provider acceptance marker
        shell: bash
        run: |
          set -euo pipefail
          test -f stage20-provider-proof.txt
          test ! -L stage20-provider-proof.txt
          test -s stage20-provider-proof.txt
          grep -Eq '^Developer Sym Stage (20|21) provider ' stage20-provider-proof.txt
